name: Bug report
description: Report a reproducible problem without account or stream data.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities use private reporting in SECURITY.md. Never attach tokens, signed URLs, account/device identifiers, official-app caches, DRM data, viewing history, or raw network captures. Protected black screenshots can be expected DRM behavior."
  - type: input
    id: version
    attributes:
      label: App version/build and macOS version
      placeholder: "Use About / bundle metadata; Apple silicon only"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result, actual result
      description: Use generic source types (HD/UHD/live/replay), not personalized URLs.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and route
      description: "Optional: safe error category/code; local or AirPlay; redacted control screenshot. No subscriber data or protected frames."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I removed secrets, personal information, signed URLs and DRM material.
          required: true
